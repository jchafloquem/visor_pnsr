@if (points().length > 1) {
  <svg
    class="w-full h-[96px] block"
    [attr.viewBox]="'-4 -6 ' + (W + 8) + ' ' + (Hh + 12)"
    role="img"
    aria-label="Avance físico real frente a programado en las últimas 10 semanas"
  >
    <path
      [attr.d]="plannedPath()"
      fill="none"
      stroke="var(--color-ink-muted)"
      stroke-width="2"
      stroke-dasharray="5 4"
    />
    <path
      [attr.d]="actualAreaPath()"
      fill="var(--color-azul-institucional)"
      opacity="0.08"
    />
    <path
      [attr.d]="actualPath()"
      fill="none"
      stroke="var(--color-azul-institucional)"
      stroke-width="2.5"
    />
    <circle
      [attr.cx]="W"
      [attr.cy]="endCy()"
      r="4"
      fill="var(--color-azul-institucional)"
    />
  </svg>
  <div class="text-[12px] text-ink-muted flex gap-[14px] flex-wrap mt-1">
    <span class="inline-flex items-center gap-1.5">
      <span class="inline-block w-3 h-[2.5px] bg-azul-institucional"></span>
      Real
    </span>
    <span class="inline-flex items-center gap-1.5">
      <span
        class="inline-block w-3 h-0 border-t-2 border-dashed border-ink-muted"
      ></span>
      Programado
    </span>
    <span>Cada punto es un corte semanal</span>
  </div>
}
