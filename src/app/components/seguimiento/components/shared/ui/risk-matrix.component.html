<div class="grid grid-cols-[74px_repeat(5,1fr)] gap-[5px] items-center">
  @for (row of matrixRows(); track row.p) {
    <div class="text-[11.5px] font-semibold text-ink-muted text-right pr-1">
      {{ row.p }}
    </div>
    @for (cell of row.cells; track cell.i) {
      <button
        type="button"
        class="rounded-[7px] flex flex-col items-center justify-center font-bold border-2 cursor-pointer transition-transform hover:scale-[1.03]"
        [class.h-[54px]]="!compact()"
        [class.h-[44px]]="compact()"
        [class]="getCellColorClass(cell.nivel)"
        [class.outline]="cell.selected"
        [class.outline-3]="cell.selected"
        [class.outline-azul-institucional-dark]="cell.selected"
        [class.outline-offset-2]="cell.selected"
        [attr.tabindex]="clickable() ? 0 : -1"
        [attr.title]="
          row.p + ' × ' + cell.i + ' = ' + cell.score.toFixed(3) + ' · ' + cell.count + ' riesgo(s)'
        "
        (click)="onCellClick(row.p, cell.i)"
      >
        @if (!compact()) {
          <span class="text-[17px] leading-none">{{ cell.count || '' }}</span>
          <span class="text-[10px] font-semibold opacity-75">{{ cell.score.toFixed(3) }}</span>
        } @else {
          <span class="text-[12px] font-bold">{{ cell.score.toFixed(3) }}</span>
        }
      </button>
    }
  }
  <div></div>
  @for (iLab of impactoLabels; track iLab) {
    <div class="text-[11.5px] font-semibold text-ink-muted text-center">
      {{ iLab }}
    </div>
  }
</div>
@if (!compact()) {
  <div class="text-[12px] text-ink-muted flex justify-between mt-[6px]">
    <span>↑ Probabilidad</span>
    <span>Impacto →</span>
  </div>
}
