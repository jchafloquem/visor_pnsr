<footer
  class="no-print border-t border-border-base bg-surface-card px-5 py-4 font-dm-sans text-xs text-ink-muted"
  role="contentinfo"
>
  <div class="mx-auto flex max-w-7xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-3">
      <img
        src="assets/images/logo_mvcs.png"
        [alt]="config.ministryName"
        width="120"
        height="27"
        class="h-[27px] w-[120px] object-contain"
      />
      <span class="hidden sm:inline-block h-6 w-px bg-border-base" aria-hidden="true"></span>
      <div>
        <p class="m-0 font-semibold text-gris-estructura">
          {{ config.programShortName }} · {{ config.programName }}
        </p>
        <p class="m-0 text-[11px] text-ink-muted">
          {{ config.footer.address }} · {{ config.footer.phone }}
        </p>
      </div>
    </div>
    <p class="m-0 text-[11px] text-ink-muted sm:text-right max-w-md">
      {{ config.footer.legalNotice }} © {{ config.footer.copyrightYear }}
    </p>
  </div>
</footer>
