<nav
  class="navbar-shell fixed z-10 top-0 left-0 w-full h-16 bg-white backdrop-blur-md text-gray-800 flex items-center justify-between px-6 border-b border-gray-200 shadow-sm">
  <!-- Logo y título -->
  <div class="navbar-brand -ml-5.75 mr-auto flex shrink-0 items-center justify-start">
    <img src="/assets/images/pnsr_logo.png" alt="Logo PNSR" class="h-14 w-auto shrink-0 object-contain">
  </div>
  <!-- Lado Derecho: Botón de Acceso -->
  <div class="navbar-actions flex-1 flex justify-end items-center gap-2">
    <button id="btn-auth" (click)="onLoginClick()"
      class="flex items-center gap-2 text-gray-700 hover:bg-primary/10 hover:text-primary px-3 py-2 rounded-md transition-colors cursor-pointer"
      [title]="isAuthenticated() ? 'Cerrar Sesión' : 'Acceder'">
      @if (isAuthenticated()) {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span class="hidden text-sm sm:inline font-medium">{{ userName() }}</span>
      } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
        <polyline points="10 17 15 12 10 7" />
        <line x1="15" y1="12" x2="3" y2="12" />
      </svg>
      <span class="hidden text-sm sm:inline">Ingresar</span>
      }
    </button>
  </div>
</nav>
