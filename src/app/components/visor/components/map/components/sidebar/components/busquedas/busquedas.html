

<div class="space-y-4 p-1">
  <p class="text-xs text-slate-500">
    Seleccione una ubicación para centrarla en el mapa. Puede buscar por departamento, provincia o distrito.
  </p>

  <div class="space-y-3">
    <div>
      <label for="busqueda-departamento" class="mb-1 block text-xs font-semibold text-slate-600">
        Departamento
      </label>
      <select
        id="busqueda-departamento"
        [ngModel]="departamentoSeleccionado"
        (ngModelChange)="onDepartamentoChange($event)"
        [disabled]="cargandoDepartamentos || departamentos.length === 0"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 disabled:bg-slate-100"
      >
        <option value="">{{ cargandoDepartamentos ? 'Cargando departamentos...' : 'Seleccione un departamento' }}</option>
        @for (departamento of departamentos; track departamento.code) {
          <option [value]="departamento.code">{{ departamento.name }}</option>
        }
      </select>
    </div>

    <div>
      <label for="busqueda-provincia" class="mb-1 block text-xs font-semibold text-slate-600">
        Provincia
      </label>
      <select
        id="busqueda-provincia"
        [ngModel]="provinciaSeleccionada"
        (ngModelChange)="onProvinciaChange($event)"
        [disabled]="!departamentoSeleccionado || cargandoProvincias || provincias.length === 0"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 disabled:bg-slate-100"
      >
        <option value="">
          {{ cargandoProvincias ? 'Cargando provincias...' : 'Seleccione una provincia' }}
        </option>
        @for (provincia of provincias; track provincia.code) {
          <option [value]="provincia.code">{{ provincia.name }}</option>
        }
      </select>
    </div>

    <div>
      <label for="busqueda-distrito" class="mb-1 block text-xs font-semibold text-slate-600">
        Distrito
      </label>
      <select
        id="busqueda-distrito"
        [ngModel]="distritoSeleccionado"
        (ngModelChange)="onDistritoChange($event)"
        [disabled]="!provinciaSeleccionada || cargandoDistritos || distritos.length === 0"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 disabled:bg-slate-100"
      >
        <option value="">
          {{ cargandoDistritos ? 'Cargando distritos...' : 'Seleccione un distrito' }}
        </option>
        @for (distrito of distritos; track distrito.code) {
          <option [value]="distrito.code">{{ distrito.name }}</option>
        }
      </select>
    </div>
  </div>

  @if (mensajeError) {
    <p role="alert" class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-700">
      {{ mensajeError }}
    </p>
  }

  <button
    type="button"
    (click)="buscar()"
    [disabled]="!departamentoSeleccionado || buscando()"
    class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary px-3 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary/90 disabled:cursor-not-allowed disabled:opacity-50"
  >
    @if (buscando()) {
      <span class="material-icons animate-spin text-base" aria-hidden="true">refresh</span>
      Buscando...
    } @else {
      <span class="material-icons text-base" aria-hidden="true">search</span>
      Buscar ubicación
    }
  </button>

  @if (tieneBusquedaResaltada()) {
    <button
      type="button"
      aria-label="Limpiar resaltado de búsqueda"
      title="Limpiar el resaltado amarillo"
      (click)="limpiarBusqueda()"
      class="ml-auto flex items-center gap-1 rounded-md border border-amber-300 bg-amber-50 px-2 py-1 text-[11px] font-medium text-amber-800 transition-colors hover:bg-amber-100"
    >
      <i class="bi bi-eraser-fill" aria-hidden="true"></i>
      Quitar resaltado
    </button>
  }
</div>
