@if (!mapService.isReady()) {
<div class="map-loading-overlay fixed inset-0 z-99999 flex flex-col items-center justify-center"
  role="status" aria-live="polite" aria-busy="true">
  <div class="map-loading-content relative z-10 flex flex-col items-center justify-center">
     <app-spinner [showBackground]="true" size="h-24 w-24 sm:h-32 sm:w-32" color="text-white"></app-spinner>
      <span class="relative z-10 mt-4 text-sm font-bold uppercase tracking-[0.2em] text-white/80">
        Cargando…
      </span>    
  </div>
</div>
}
<div class="map-ready-content" [class.map-ready-content-visible]="mapService.isReady()">
  <app-navbar (login)="openLoginModal()"></app-navbar>
  <app-sidebar (onToggle)="handleSidebarToggle($event)"></app-sidebar>
  <div #mapContainer id="mapContainer" class="map-container" [class.blank-base]="mapService.baseLayerType() === 'blanco'" [class.sidebar-open]="sidebarAbierto">
  </div>
  <app-funciones></app-funciones>
  <app-leyenda></app-leyenda>
  <app-coordinate-info></app-coordinate-info>
</div>
