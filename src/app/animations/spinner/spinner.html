<div class="relative flex items-center justify-center">
  @if (showBackground()) {
    <div class="spinner-background" aria-hidden="true"></div>
  }
  <svg
    [class]="'relative z-10 animate-spin neon-wrapper ' + size() + ' ' + color()"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
  >
  <circle class="opacity-20 text-primary" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-100" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
  @if (imageUrl()) {
    <div class="absolute inset-0 z-20 flex items-center justify-center pointer-events-none">
      <img [src]="imageUrl()" alt="" aria-hidden="true" class="spinner-center-image w-2/3 h-2/3 rounded-lg object-contain" />
    </div>
  }
</div>
